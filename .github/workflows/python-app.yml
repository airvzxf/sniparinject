name: Python App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.10.20", "3.10.21", "3.10.22", "3.11", "3.11.15", "3.11.16", "3.11.17", "3.11.18", "3.12", "3.12.13", "3.12.14", "3.12.15", "3.12.16", "3.13", "3.13.15", "3.13.16", "3.13.17", "3.13.18", "3.14", "3.14.7", "3.14.8", "3.14.9", "3.14.10"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            echo ""
            echo "=== Python: Install requirements from file ==="
            pip install -r requirements.txt
          else
            echo ""
            echo "=== Python: Install default dependencies ==="
            pip install flake8 pylint pytest coverage
          fi

      - name: Set up environment
        run: ./script/setup-dev.bash

      - name: Run PyLint
        run: ./script/qa-pylint.bash

      - name: Run Flake8
        run: ./script/qa-flake8.bash

      - name: Run PyTest
        run: ./script/qa-pytest.bash

      - name: Run Coverage
        run: ./script/qa-coverage.bash
