name: Python App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            echo ""
            echo "=== Python: Install requirements from file ==="
            pip install -r requirements.txt
          else
            echo ""
            echo "=== Python: Install default dependencies ==="
            pip install flake8 pylint pytest coverage
          fi

      - name: Set up environment
        run: ./script/setup-dev.bash

      - name: Run PyLint
        run: ./script/qa-pylint.bash

      - name: Run Flake8
        run: ./script/qa-flake8.bash

      - name: Run Ruff
        run: ./script/qa-ruff.bash

      - name: Run Mypy
        run: ./script/qa-mypy.bash

      - name: Run Bandit
        run: ./script/qa-bandit.bash

      - name: Check the man pages
        run: ./script/qa-man.bash

      - name: Run PyTest
        run: ./script/qa-pytest.bash

      - name: Run Coverage
        run: ./script/qa-coverage.bash
