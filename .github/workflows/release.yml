name: Release

on:
  release:
    types: [ published ]

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^version = //p' src/setup.cfg)
          if [ "${TAG}" != "v${version}" ]; then
            echo "The tag ${TAG} doesn't match the version ${version} in src/setup.cfg."
            exit 1
          fi

      - name: Build
        working-directory: src
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel

      - name: Upload the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: src/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sniparinject
    permissions:
      id-token: write

    steps:
      - name: Download the distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
